<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Attendance — Student</title>
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="logo">🎓</span> Smart Attendance</div>
    <nav>
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="scan.html">📷 Scan QR</a>
      <a href="history.html">📊 My Attendance</a>
    </nav>
    <div class="sidebar-footer"><a href="../index.html" style="color:#94a3b8;">← Logout</a></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-btn">☰</button>
        <h1>My Attendance</h1>
      </div>
      <div class="user">
        <span id="topbar-user-name">Guest</span>
        <div class="avatar" id="topbar-user-initials">–</div>
      </div>
    </header>

    <div class="page page-grid">
      <div class="stat-grid">
        <div class="stat"><div class="stat-label">Present</div><div class="stat-value" id="stat-present">—</div></div>
        <div class="stat"><div class="stat-label">Late</div><div class="stat-value" id="stat-late">—</div></div>
        <div class="stat"><div class="stat-label">Absent</div><div class="stat-value" id="stat-absent">—</div></div>
        <div class="stat"><div class="stat-label">Attendance %</div><div class="stat-value" id="stat-percent">—</div></div>
      </div>

      <div class="card">
        <div class="card-title">Recent Records</div>
        <table class="table">
          <thead>
            <tr><th>Date</th><th>Course</th><th>Time</th><th>Status</th></tr>
          </thead>
          <tbody id="records-body">
            <tr>
              <td colspan="4">
                <div class="empty">
                  <div class="empty-icon">📊</div>
                  <strong>No attendance records yet</strong>
                  Your attendance history will appear here once you start marking.
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="../assets/js/nav.js"></script>
</body>
</html>
